[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-user-pin"
dynamic = ["version"]
description = "Reusable personal PIN (second factor / unlock) for NetBox and NetBox plugins"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Peter Knotek" }]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "segno>=1.5",
]

[project.urls]
Source = "https://github.com/ArK761/NetBox_UserPIN"

[tool.setuptools.dynamic]
version = { attr = "netbox_user_pin.__version__" }

[tool.setuptools.packages.find]
include = ["netbox_user_pin*"]

[tool.setuptools.package-data]
netbox_user_pin = ["templates/**/*", "locale/**/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
