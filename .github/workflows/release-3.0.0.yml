name: release-3.0.0
on:
  push:
    branches: [tmp-release-3-0-0]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release 3.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 3.0.0 --repo "$GITHUB_REPOSITORY" --target ce0790857c5a6eeeaf1531a66c0ab349ea3eee5b \
            --title "3.0.0" --notes "User PIN 3.0.0: security fixes after the audit (Authorization header bypass, tokens/api flags, own API keys, default deny for the account area, fail closed on database errors, shared cache version). API tokens stay outside the PIN protection by decision. Commit ce07908. Previous: 2.5.0."
