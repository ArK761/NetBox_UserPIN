{% extends 'base/base.html' %}
{% load static i18n %}
{% block title %}{% block guest_title %}NetBox{% endblock %}{% endblock %}
{% block layout %}
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <img src="{% static 'logo_netbox_dark_teal.svg' %}" alt="NetBox" height="60" class="hide-theme-dark logo">
      <img src="{% static 'logo_netbox_bright_teal.svg' %}" alt="NetBox" height="60" class="hide-theme-light logo">
    </div>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    {% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}
    <div class="card card-md"><div class="card-body">{% block guest_body %}{% endblock %}</div></div>
  </div>
</div>
{% endblock %}
