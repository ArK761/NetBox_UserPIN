{% load i18n %}
<script>
(function () {
  var search = document.getElementById('pin-field-search');
  if (search) {
    search.addEventListener('input', function () {
      var q = this.value.toLowerCase();
      document.querySelectorAll('#pin-fields .pin-field-row').forEach(function (row) {
        row.style.display = (!q || row.textContent.toLowerCase().indexOf(q) >= 0) ? '' : 'none';
      });
    });
  }
  // what belongs to a field is shown only while the field is written: hidden and read-only fields have nothing more to set
  function syncRow(row) {
    var checked = row.querySelector('.pin-mode:checked'), extra = row.querySelector('.pin-extra');
    if (extra) { extra.style.display = (!checked || checked.value === 'default' || checked.value === 'write') ? '' : 'none'; }
  }
  document.querySelectorAll('#pin-fields .pin-field-row').forEach(function (row) {
    syncRow(row);
    row.querySelectorAll('.pin-mode').forEach(function (radio) { radio.addEventListener('change', function () { syncRow(row); }); });
  });
  document.querySelectorAll('.pin-bulk').forEach(function (button) {
    button.addEventListener('click', function () {
      document.querySelectorAll('#pin-fields .pin-field-row').forEach(function (row) {
        if (row.style.display === 'none') { return; }
        var radio = row.querySelector('input[type=radio][value=' + button.dataset.mode + ']');
        if (radio) { radio.checked = true; syncRow(row); }
      });
    });
  });
  var box = document.getElementById('pin-fields-box');
  if (box && location.hash === '#pin-fields-box') { box.open = true; }

  // the conditions on the records (allowed and denied): values are chips (agg, core ...)
  var meta = document.getElementById('pin-filter-fields');
  if (!meta) { return; }
  var byKey = {};
  JSON.parse(meta.textContent).forEach(function (f) { byKey[f.key] = f; });
  document.querySelectorAll('.pin-rule-form').forEach(function (form) {
    var field = form.querySelector('.pin-rule-field'), op = form.querySelector('.pin-rule-op'),
        text = form.querySelector('.pin-rule-text'), choice = form.querySelector('.pin-rule-choice'),
        chips = form.querySelector('.pin-rule-chips');
    function addChip(value) {
      value = value.trim();
      if (!value) { return; }
      var multi = ['contains', 'ncontains', 'startswith', 'in', 'nin', 'eq', 'ne'].indexOf(op.value) >= 0;
      if (!multi) { chips.innerHTML = ''; }
      var seen = Array.prototype.some.call(chips.querySelectorAll('input'), function (i) { return i.value.toLowerCase() === value.toLowerCase(); });
      if (seen) { return; }
      var chip = document.createElement('span'), input = document.createElement('input'), remove = document.createElement('button');
      chip.className = 'badge text-bg-secondary pin-chip fs-6';
      input.type = 'hidden'; input.name = 'values'; input.value = value;
      remove.type = 'button'; remove.className = 'btn btn-link btn-sm p-0 text-white'; remove.textContent = '×';
      remove.addEventListener('click', function () { chip.remove(); });
      chip.appendChild(document.createTextNode(value + ' ')); chip.appendChild(input); chip.appendChild(remove);
      chips.appendChild(chip);
    }
    function refresh() {
      var info = byKey[field.value], free = ['contains', 'ncontains', 'startswith'].indexOf(op.value) >= 0,
          multi = ['in', 'nin', 'eq', 'ne'].indexOf(op.value) >= 0;
      chips.innerHTML = '';
      if (info && info.choices && !free) {
        choice.innerHTML = '';
        info.choices.forEach(function (c) { var o = document.createElement('option'); o.value = c[0]; o.text = c[1]; choice.appendChild(o); });
        choice.name = 'values'; choice.multiple = multi; choice.size = multi ? 6 : 1;
        choice.classList.remove('d-none'); choice.disabled = false; text.classList.add('d-none');
      } else {
        choice.classList.add('d-none'); choice.disabled = true; choice.removeAttribute('name'); text.classList.remove('d-none');
      }
    }
    text.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ',') { event.preventDefault(); addChip(text.value); text.value = ''; }
    });
    form.addEventListener('submit', function () { if (text.value.trim()) { addChip(text.value); text.value = ''; } });
    field.addEventListener('change', refresh); op.addEventListener('change', refresh);
    refresh();
  });
})();
</script>
