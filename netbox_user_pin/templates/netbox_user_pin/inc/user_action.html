<form method="post" action="{% url 'plugins:netbox_user_pin:user_action' pk=row.user.pk action=action %}"{% if confirm %} onsubmit="return confirm('{{ label|escapejs }}: {{ row.user.username|escapejs }}?');"{% endif %}>
  {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" class="dropdown-item"><i class="mdi mdi-{{ icon }} me-2"></i>{{ label }}</button>
</form>
